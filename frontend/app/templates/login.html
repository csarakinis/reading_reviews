{% extends "base.html" %}

{% block title %}Choose Profile — Reading Reviews{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 text-center">
        <div class="card shadow-sm">
            <div class="card-body py-5">
                <i class="bi bi-person-circle display-4 text-primary mb-3 d-block"></i>
                <h2 class="h4 mb-1">Choose your profile</h2>
                <p class="text-muted mb-4">Each profile has its own separate reading list.</p>
                <div class="d-grid gap-3">
                    <!-- Each form posts to /login with a different user_id value.
                         The handler sets the session cookie to that value. -->
                    <form action="/login" method="post">
                        <input type="hidden" name="user_id" value="user-1">
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-person me-2"></i>User 1
                        </button>
                    </form>
                    <form action="/login" method="post">
                        <input type="hidden" name="user_id" value="user-2">
                        <button type="submit" class="btn btn-outline-primary btn-lg w-100">
                            <i class="bi bi-person me-2"></i>User 2
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
