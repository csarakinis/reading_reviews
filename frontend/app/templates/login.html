{% extends "base.html" %}

{% block title %}Sign In — Reading Reviews{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body py-5 px-4">
                <i class="bi bi-book-half display-4 text-primary mb-3 d-block text-center"></i>
                <h2 class="h4 mb-1 text-center">Sign in</h2>
                <p class="text-muted text-center mb-4">Enter your email to access your reading list.</p>

                {% if errors %}
                <div class="alert alert-danger">
                    {% for error in errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
                </div>
                {% endif %}

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address <span class="text-danger">*</span></label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ email | default('') }}"
                            required
                            autofocus
                        >
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                        </button>
                    </div>
                </form>
                <hr class="my-4">
                <p class="text-center text-muted small mb-0">
                    No account yet? <a href="/register">Create one</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
