{% extends "base.html" %}

{% block title %}Add Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Register as a new user</h4>
            </div>
            <div class="card-body">
                {% if errors %}
                <div class="alert alert-danger">
                    {% for error in errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
                </div>
                {% endif %}

                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">User Name / Email <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ form_data.username if form_data else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="password" name="password"
                               value="{{ form_data.password if form_data else '' }}" required>
                    </div>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg me-1"></i>Register
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
