{% extends "base.html" %}

{% block title %}Add Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add a Book</h4>
            </div>
            <div class="card-body">
                {% if errors %}
                <div class="alert alert-danger">
                    {% for error in errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
                </div>
                {% endif %}

                <!-- OpenLibrary search — fills the form fields below when the user picks a result -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Search OpenLibrary</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="ol-search-query"
                               placeholder="Search by title or author…">
                        <button class="btn btn-outline-primary" type="button" id="ol-search-btn">
                            <i class="bi bi-search me-1"></i>Search
                        </button>
                    </div>
                    <div id="ol-results" class="mt-3" style="display:none;"></div>
                </div>
                <hr class="mb-4">

                <form action="/books/add" method="post">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title"
                               value="{{ form_data.title if form_data else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="author" name="author"
                               value="{{ form_data.author if form_data else '' }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="genre" class="form-label">Genre</label>
                            <input type="text" class="form-control" id="genre" name="genre"
                                   value="{{ form_data.genre if form_data else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn" name="isbn"
                                   value="{{ form_data.isbn if form_data else '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="total_pages" class="form-label">Total Pages</label>
                            <input type="number" class="form-control" id="total_pages" name="total_pages"
                                   min="1" value="{{ form_data.total_pages if form_data else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="status" name="status">
                                {% for key, label in status_labels.items() %}
                                <option value="{{ key }}"
                                    {% if form_data and form_data.status == key %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <input type="hidden" name="cover_url" id="cover_url">
                    <div class="d-flex justify-content-between mt-3">
                        <a href="/books" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg me-1"></i>Add Book
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
