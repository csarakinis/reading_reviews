[tool.poetry]
name = "reading-reviews-frontend"
version = "1.0.0"
description = "Frontend UI for the Reading Reviews tracking application"
authors = ["Reading Reviews"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.6"
uvicorn = {extras = ["standard"], version = "0.32.1"}
jinja2 = "3.1.4"
httpx = "0.28.1"
python-multipart = "0.0.20"
itsdangerous = "2.2.0"
starlette = "0.41.3"
pydantic = "2.10.3"
pydantic-settings = "2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
