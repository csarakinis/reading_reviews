[tool.poetry]
name = "reading-reviews-backend"
version = "1.0.0"
description = "Backend API for the Reading Reviews tracking application"
authors = ["Reading Reviews"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.121.3"
uvicorn = {extras = ["standard"], version = "0.32.1"}
sqlalchemy = "2.0.36"
psycopg2-binary = "2.9.10"
alembic = "1.14.0"
pydantic = "2.10.3"
pydantic-settings = "2.6.1"
polars = "1.17.1"
python-multipart = "0.0.22"
itsdangerous = "2.2.0"
starlette = "0.49.1"
httpx = "0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
httpx = "0.28.1"
pytest-cov = "6.0.0"
testcontainers = {version = "4.9.0", extras = ["postgres"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.poetry.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
